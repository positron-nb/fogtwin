<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FogTwin — ESP32 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  body { overflow: auto; }
  main { max-width: 1120px; margin: 0 auto; padding: 26px 26px 90px; }

  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.03em; margin: 0 0 6px; }
  .sub2 { font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
          text-transform: uppercase; color: var(--ink-3); margin-bottom: 22px; }
  h2 { font-size: 17px; font-weight: 600; margin: 32px 0 6px; letter-spacing: -.01em; }
  h2 .n { font-family: var(--mono); font-size: 10px; color: var(--accent);
          letter-spacing: .16em; display: block; margin-bottom: 7px; }
  p { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); max-width: 82ch; margin: 0 0 12px; }
  p b, li b { color: var(--ink); font-weight: 600; }
  ol, ul { max-width: 82ch; padding-left: 20px; margin: 0 0 14px; }
  li { font-size: 13.5px; line-height: 1.65; color: var(--ink-2); margin-bottom: 9px; }
  li::marker { color: var(--accent); font-family: var(--mono); font-size: .85em; }
  code { font-family: var(--mono); font-size: .87em; background: var(--panel-2);
         border: 1px solid var(--rule); padding: 1px 5px; color: var(--ink); }
  pre { background: var(--panel); border: 1px solid var(--rule); border-left: 3px solid var(--slate);
        padding: 12px 14px; overflow-x: auto; font-family: var(--mono); font-size: 11.5px;
        line-height: 1.65; color: var(--ink-2); margin: 10px 0 14px; max-width: 82ch; }
  pre b { color: var(--accent); font-weight: 500; }

  /* live status strip */
  .live { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
          gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 18px 0 6px; }
  .live div { background: var(--panel); padding: 15px 17px; }
  .live .v { font-size: 24px; font-weight: 700; letter-spacing: -.03em; line-height: 1;
             font-variant-numeric: tabular-nums; }
  .live .v.on { color: var(--ok); } .live .v.off { color: var(--ink-3); }
  .live .k { font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
             text-transform: uppercase; color: var(--ink-3); margin-top: 8px; line-height: 1.5; }
  .pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
           background: var(--ink-3); margin-right: 8px; vertical-align: 1px; }
  .pulse.on { background: var(--ok); box-shadow: 0 0 0 0 rgba(79,190,139,.7);
              animation: ring 1.8s infinite; }
  @keyframes ring { to { box-shadow: 0 0 0 9px rgba(79,190,139,0); } }
  @media (prefers-reduced-motion: reduce) { .pulse.on { animation: none; } }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0 8px;
          background: var(--panel); border: 1px solid var(--rule); max-width: 82ch; }
  th { font-family: var(--mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase;
       color: var(--ink-3); text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
  th.r, td.r { text-align: right; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--rule); color: var(--ink-2);
       font-family: var(--mono); font-size: 12px; }
  td:first-child { color: var(--ink); }
  tr:last-child td { border-bottom: 0; }
  tr.total td { color: var(--accent); font-weight: 600; }

  .wirewrap { background: var(--panel); border: 1px solid var(--rule); padding: 16px; margin: 12px 0; }
  .wirewrap svg { display: block; width: 100%; height: auto; }

  .note { border: 1px solid var(--rule); border-left: 3px solid var(--accent);
          background: var(--panel); padding: 14px 17px; margin: 14px 0; max-width: 82ch; }
  .note h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .15em;
             text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  .note p:last-child { margin-bottom: 0; }
  .warnnote { border-left-color: var(--warn); }
  .warnnote h4 { color: var(--warn); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Bailadila <span>FogTwin</span></div>
  <div class="sub">ESP32 prototype node</div>
  <div class="spacer"></div>
  <a class="sub" href="/control" style="color:var(--slate);text-decoration:none">control room</a>
  <a class="sub" href="/hud" style="color:var(--slate);text-decoration:none">cab hud</a>
  <a class="sub" href="/hardware" style="color:var(--slate);text-decoration:none">hardware</a>
  <a class="sub" href="/results" style="color:var(--slate);text-decoration:none">results</a>
</div>

<main id="main"></main>

<script type="module" src="/static/js/prototype.js"></script>
</body>
</html>
