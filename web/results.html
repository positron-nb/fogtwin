<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FogTwin — Measured Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
<style>
  /* style.css pins html and body to the viewport with overflow hidden, which
     suits the three fullscreen surfaces but makes this long document scroll
     inside <body> instead of the window -- so window scroll events never fire
     and scrollY stays nailed at zero. Hand scrolling back to the document. Note `visible`, not `auto`:
     `auto` would make <body> its own scroll container, and a sticky topbar
     inside it would then have nothing to stick to. */
  html, body { height: auto; overflow: visible; }
  main { max-width: 1120px; margin: 0 auto; padding: 30px 26px 90px; }
  /* the only page long enough to lose its own navigation off the top */
  .topbar { position: sticky; top: 0; z-index: 30; }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.03em; margin: 0 0 6px; }
  .sub2 { font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
          text-transform: uppercase; color: var(--ink-3); margin-bottom: 26px; }
  h2 { font-size: 17px; font-weight: 600; margin: 34px 0 4px; letter-spacing: -.01em; }
  h2 .n { font-family: var(--mono); font-size: 10px; color: var(--accent);
          letter-spacing: .16em; display: block; margin-bottom: 7px; }
  p { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); max-width: 82ch; margin: 0 0 12px; }
  p b, li b { color: var(--ink); font-weight: 600; }
  ul { max-width: 82ch; padding-left: 18px; margin: 0 0 14px; }
  li { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); margin-bottom: 8px; }
  li::marker { color: var(--accent); }
  code { font-family: var(--mono); font-size: .88em; background: var(--panel-2);
         border: 1px solid var(--rule); padding: 1px 5px; }

  .headline { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
              gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: 22px 0 8px; }
  .headline div { background: var(--panel); padding: 16px 18px; }
  .headline .v { font-size: 30px; font-weight: 700; letter-spacing: -.035em;
                 font-variant-numeric: tabular-nums; line-height: 1; }
  .headline .v.good { color: var(--ok); } .headline .v.warn { color: var(--warn); }
  .headline .k { font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
                 text-transform: uppercase; color: var(--ink-3); margin-top: 9px; line-height: 1.5; }

  .method { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 8px; }
  .arm { background: var(--panel); border: 1px solid var(--rule); padding: 14px 16px; }
  .arm.b { border-left: 3px solid var(--ink-3); }
  .arm.f { border-left: 3px solid var(--accent); }
  .arm h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
            text-transform: uppercase; margin: 0 0 8px; color: var(--ink-3); }
  .arm p { font-size: 12.5px; margin: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 14px 0 10px;
          background: var(--panel); border: 1px solid var(--rule); }
  th { font-family: var(--mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase;
       color: var(--ink-3); text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  th:first-child { text-align: left; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--rule); text-align: right;
       font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  td:first-child { text-align: left; color: var(--ink); }
  tr:last-child td { border-bottom: 0; }
  td .sd { color: var(--ink-3); font-size: 10.5px; }
  td.gain { color: var(--ok); font-weight: 600; }
  td.gain.neg { color: var(--warn); }

  .chartwrap { background: var(--panel); border: 1px solid var(--rule); padding: 16px; margin: 14px 0 6px; }
  .chartwrap svg { display: block; width: 100%; height: auto; }
  .key { display: flex; gap: 16px; font-family: var(--mono); font-size: 10px;
         color: var(--ink-3); margin-top: 10px; }
  .key i { display: inline-block; width: 11px; height: 11px; margin-right: 5px;
           vertical-align: -1px; }

  .caveat { border: 1px solid var(--rule); border-left: 3px solid var(--warn);
            background: var(--panel); padding: 15px 18px; margin: 16px 0; }
  .caveat h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .15em;
               text-transform: uppercase; color: var(--warn); margin: 0 0 8px; }
  .caveat p:last-child { margin-bottom: 0; }

  .bugs { border: 1px solid var(--rule); border-left: 3px solid var(--crit);
          background: var(--panel); padding: 15px 18px; margin: 16px 0; }
  .bugs h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .15em;
             text-transform: uppercase; color: var(--crit); margin: 0 0 8px; }

  .runcfg { font-family: var(--mono); font-size: 11px; color: var(--ink-3);
            border: 1px solid var(--rule); padding: 10px 14px; margin: 14px 0; background: var(--panel); }
  .miss { padding: 40px; text-align: center; font-family: var(--mono);
          font-size: 12px; color: var(--ink-3); border: 1px solid var(--rule); }

  /* scroll progress — a long page of evidence benefits from a sense of place */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 2px;
              background: transparent; z-index: 40; pointer-events: none; }
  .progress i { display: block; height: 100%; width: 0;
                background: linear-gradient(90deg, var(--slate), var(--accent)); }

  .chartwrap .bar { cursor: crosshair; }
  .chartwrap .bar:hover { opacity: 1 !important; }
  /* base state, so this holds with reduced motion too -- the animated rules
     below only fade the whiskers in to this same value */
  .chartwrap .whisk { opacity: .55; }

  /* ------------------------------------------------------------------
     Motion. Everything below is opt-in: with prefers-reduced-motion the
     page renders finished and static, which is also what a print or a
     screenshot gets.
     ------------------------------------------------------------------ */
  /* never let the reveal state survive into print */
  @media print {
    .reveal { opacity: 1 !important; filter: none !important; transform: none !important; }
    .progress { display: none; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { opacity: 0; filter: blur(9px); transform: translateY(16px);
              transition: opacity .62s ease, filter .62s ease,
                          transform .62s cubic-bezier(.22,.85,.28,1); }
    .reveal.in { opacity: 1; filter: blur(0); transform: none; }

    /* bars scale from their own baseline, so the axis stays put */
    .chartwrap .bar { transform: scaleY(0); transform-origin: 50% 100%;
                      transform-box: fill-box;
                      transition: transform .9s cubic-bezier(.2,.85,.25,1);
                      transition-delay: var(--d, 0ms); }
    .chartwrap.in .bar { transform: scaleY(1); }

    /* curves draw themselves in; the dash length is a generous over-estimate
       of any path here, which is all stroke-dashoffset needs to hide one */
    .chartwrap .line { stroke-dasharray: 3000; stroke-dashoffset: 3000;
                       transition: stroke-dashoffset 1.15s ease;
                       transition-delay: var(--d, 0ms); }
    .chartwrap.in .line { stroke-dashoffset: 0; }
    .chartwrap .dot { opacity: 0; transition: opacity .45s ease;
                      transition-delay: calc(var(--d, 0ms) + 850ms); }
    .chartwrap.in .dot { opacity: 1; }

    /* the value and its error bar arrive once the bar has got there */
    .chartwrap .whisk, .chartwrap .blab { opacity: 0;
      transition: opacity .4s ease; transition-delay: calc(var(--d, 0ms) + 640ms); }
    .chartwrap.in .whisk { opacity: .55; }
    .chartwrap.in .blab { opacity: 1; }

    .headline div { opacity: 0; transform: translateY(10px);
                    transition: opacity .5s ease, transform .5s ease; }
    .headline.in div { opacity: 1; transform: none; }
    .headline.in div:nth-child(2) { transition-delay: .08s; }
    .headline.in div:nth-child(3) { transition-delay: .16s; }
    .headline.in div:nth-child(4) { transition-delay: .24s; }
  }
</style>
</head>
<body>

<div class="progress"><i id="prog"></i></div>

<div class="topbar">
  <div class="brand">Bailadila <span>FogTwin</span></div>
  <div class="sub">Measured results</div>
  <nav class="nav">
    <a href="/control">Control</a>
    <a href="/hud">Cab HUD</a>
    <a href="/hardware">Hardware</a>
    <a href="/results" aria-current="page">Results</a>
    <a href="/node">Node</a>
  </nav>
  <div class="spacer"></div>
</div>

<main id="main">
  <div class="miss">loading experiment…</div>
</main>

<script type="module" src="/static/js/results.js"></script>
</body>
</html>
